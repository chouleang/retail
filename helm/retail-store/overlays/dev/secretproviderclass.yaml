apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: retail-dev-endpoints
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "retail-dev-dataplane-endpoints"
        objectType: "secretsmanager"
        jmesPath:
          - path: "catalog_mysql_host"
            objectAlias: "CATALOG_MYSQL_HOST"
          - path: "orders_postgres_host"
            objectAlias: "ORDERS_POSTGRES_HOST"
          - path: "orders_postgres_db"
            objectAlias: "ORDERS_POSTGRES_DB"
          - path: "checkout_redis_host"
            objectAlias: "CHECKOUT_REDIS_HOST"
          - path: "orders_sqs_queue_name"
            objectAlias: "ORDERS_SQS_QUEUE"
          - path: "dynamodb_region"
            objectAlias: "DYNAMODB_REGION"
  secretObjects:
    - secretName: retail-dev-dataplane
      type: Opaque
      data:
        - key: CATALOG_MYSQL_HOST
          objectName: CATALOG_MYSQL_HOST
        - key: ORDERS_POSTGRES_HOST
          objectName: ORDERS_POSTGRES_HOST
        - key: CHECKOUT_REDIS_HOST
          objectName: CHECKOUT_REDIS_HOST
        - key: ORDERS_SQS_QUEUE
          objectName: ORDERS_SQS_QUEUE
