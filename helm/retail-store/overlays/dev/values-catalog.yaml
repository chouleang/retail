# ============================================================================
# CATALOG SERVICE - CUSTOM VALUES
# ============================================================================

# ----------------------------------------------------------------------------
# IMAGE CONFIGURATION
# ----------------------------------------------------------------------------
image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
  pullPolicy: IfNotPresent
  tag: 1.3.0 
# ----------------------------------------------------------------------------
# DATABASE CONFIGURATION
# ----------------------------------------------------------------------------
mysql:
  create: false  # Using external AWS RDS MySQL database

app:
  persistence:
    provider: mysql
    endpoint: "dev-mydb3.cmfy84y8mlfq.us-east-1.rds.amazonaws.com"
    database: "catalogdb"

    secret:
      create: false  # ← CRITICAL: Don't create static secret
      name: catalog-db
      username: ""  # Not used when useSecretsManager=true
      password: ""  # Not used when useSecretsManager=true
      
      useSecretsManager: true  # Enable Secrets Manager
      secretsManager:
        secretName: "retail-dev-db-secret"
        region: "us-east-1"      

# ----------------------------------------------------------------------------
# RESOURCE MANAGEMENT
# ----------------------------------------------------------------------------
resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
    


