image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
  pullPolicy: IfNotPresent
  tag: 1.3.0

mysql:
  create: false

app:
  persistence:
    provider: mysql
    endpoint: "dev-mydb3.cmfy84y8mlfq.us-east-1.rds.amazonaws.com"
    database: "catalogdb"
    secret:
      create: false      # ← don't let Helm manage this Secret
      name: catalog-db   # ← must exactly match secretObjects.secretName in your SPC

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

serviceAccount:
  create: true
  name: catalog          # ← must match SPC's usePodIdentity + your Pod Identity association's service-account
